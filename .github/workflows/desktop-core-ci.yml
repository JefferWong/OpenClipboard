name: 'Desktop Core CI'
run-name: 'Desktop core CI for ${{ github.head_ref || github.ref_name }}'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/cli/**'
      - 'apps/daemon/**'
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-core:
    name: ${{ matrix.platform }} daemon + CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: desktop-core-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check daemon and CLI
        run: cargo check -p uc-daemon -p uc-cli --locked

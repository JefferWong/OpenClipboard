name: 'Mobile CI'
run-name: 'Mobile CI for ${{ github.head_ref || github.ref_name }}'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'crates/uc-mobile/**'
      - 'crates/uc-core/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci/check-mobile-audit.mjs'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'crates/uc-mobile/**'
      - 'crates/uc-core/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci/check-mobile-audit.mjs'
      - '.github/workflows/mobile-ci.yml'
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  RUST_VERSION: '1.95.0'

jobs:
  js-quality:
    name: Mobile JS quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

  android-debug:
    name: Android debug app
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: development
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild -p android --no-install

      - name: Build unsigned debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openclipboard-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS simulator app
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_VARIANT: development
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: mobile-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Rust xcframework and UniFFI bindings
        env:
          UC_MOBILE_BUILD_LOCKED: '1'
        run: bash crates/uc-mobile/scripts/build-ios-xcframework.sh

      - name: Stage Rust core in the Expo module
        run: |
          dest='apps/mobile/modules/uc-core/ios'
          rm -rf "$dest/UniClipboardCore.xcframework" "$dest/Bindings"
          cp -R target/UniClipboardCore.xcframework "$dest/UniClipboardCore.xcframework"
          mkdir -p "$dest/Bindings/include"
          cp target/uniffi-bindings/uc_mobile.swift "$dest/Bindings/uc_mobile.swift"
          cp -R target/uniffi-bindings/include/. "$dest/Bindings/include/"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned simulator app
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace ios/UniClipDev.xcworkspace \
            -scheme UniClipDev \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/openclipboard-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

  dependency-ratchet:
    name: Mobile dependency ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Capture production dependency audit
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/mobile-npm-audit.json" || true

      - name: Reject vulnerability-count regressions
        env:
          AUDIT_REPORT: ${{ runner.temp }}/mobile-npm-audit.json
          MAX_CRITICAL: '3'
          MAX_HIGH: '36'
        run: node ../../scripts/ci/check-mobile-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-npm-audit
          path: ${{ runner.temp }}/mobile-npm-audit.json
          if-no-files-found: error
          retention-days: 14
